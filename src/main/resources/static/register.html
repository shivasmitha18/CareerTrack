```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerTrack - Create Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <h1>CareerTrack</h1>

    <p>Create your account to start tracking your career.</p>

    <form id="registerForm">

        <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
        >

        <input
                type="email"
                id="email"
                placeholder="Email"
                required
        >

        <input
                type="password"
                id="password"
                placeholder="Password"
                required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <p id="registerMessage"></p>

    <p class="register-link">
        Already have an account?
        <a href="index.html">Login</a>
    </p>

</div>

<script src="register.js"></script>

</body>

</html>
```
